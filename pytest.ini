[pytest]
testpaths = tests
; Isolated temporary indexes per session; never remove another active run.
addopts = -ra -p no:cacheprovider
pythonpath = .
python_files = test_*.py
; Silence third-party deprecation noise (jieba/pkg_resources, protobuf, swig)
; so the one-command regression run prints clean output.
filterwarnings =
    ignore:.*pkg_resources.*:DeprecationWarning
    ignore:.*protobuf.*:DeprecationWarning
    ignore:.*SwigPy.*:DeprecationWarning
    ignore:.*swigvarlink.*:DeprecationWarning
