<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>.t{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#172033}.s{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#475569;font-size:18px}.b{fill:#fff;stroke:#94a3b8;stroke-width:2}.p{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.g{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.o{fill:#fff7ed;stroke:#f97316;stroke-width:2}.l{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a)}</style>
  </defs>
  <rect width="1600" height="700" fill="#f8fafc"/>
  <rect x="48" y="42" width="1504" height="610" rx="18" fill="#fff" stroke="#dbe3ef" stroke-width="2"/>
  <text x="88" y="102" class="t" font-size="30" font-weight="700">图 1｜员工制度自助查询流程</text>
  <text x="88" y="138" class="s">范围：系统提供问答与反馈收集；问题核实和反馈归因由人员完成</text>
  <path class="l" d="M280 300H340"/><path class="l" d="M520 300H580"/><path class="l" d="M760 300H820"/><path class="l" d="M1000 300H1060"/>
  <rect class="b" x="100" y="242" width="180" height="116" rx="12"/><text class="t" x="190" y="284" text-anchor="middle" font-size="21" font-weight="700">业务页面遇到</text><text class="t" x="190" y="314" text-anchor="middle" font-size="21" font-weight="700">制度问题</text>
  <rect class="p" x="340" y="242" width="180" height="116" rx="12"/><text class="t" x="430" y="284" text-anchor="middle" font-size="21" font-weight="700">打开助手</text><text class="t" x="430" y="314" text-anchor="middle" font-size="21">输入自然语言问题</text>
  <rect class="g" x="580" y="242" width="180" height="116" rx="12"/><text class="t" x="670" y="278" text-anchor="middle" font-size="20" font-weight="700">检索制度并保留</text><text class="t" x="670" y="310" text-anchor="middle" font-size="20" font-weight="700">候选原文依据</text>
  <polygon points="910,225 1000,300 910,375 820,300" fill="#fff" stroke="#64748b" stroke-width="2"/><text class="t" x="910" y="294" text-anchor="middle" font-size="20" font-weight="700">依据是否</text><text class="t" x="910" y="322" text-anchor="middle" font-size="20" font-weight="700">充分？</text>
  <rect class="g" x="1060" y="242" width="190" height="116" rx="12"/><text class="t" x="1155" y="278" text-anchor="middle" font-size="20" font-weight="700">生成答复并展示</text><text class="t" x="1155" y="310" text-anchor="middle" font-size="20" font-weight="700">出处与原文预览</text>
  <path class="l" d="M1250 300H1300"/><rect class="p" x="1300" y="242" width="180" height="116" rx="12"/><text class="t" x="1390" y="294" text-anchor="middle" font-size="20" font-weight="700">用户核对</text><text class="t" x="1390" y="322" text-anchor="middle" font-size="20" font-weight="700">答案与来源</text>
  <text x="1018" y="282" class="s" font-size="16">是</text><text x="923" y="400" class="s" font-size="16">否</text>
  <path class="l" d="M910 375V470H1060"/><rect class="o" x="1060" y="412" width="240" height="116" rx="12"/><text class="t" x="1180" y="450" text-anchor="middle" font-size="20" font-weight="700">提示“依据不足”</text><text class="t" x="1180" y="482" text-anchor="middle" font-size="20">建议线下核实或补充</text>
  <path class="l" d="M1390 358V585H1350"/><rect class="p" x="1080" y="550" width="270" height="70" rx="12"/><text class="t" x="1215" y="593" text-anchor="middle" font-size="20" font-weight="700">提交反馈 / 线下核实</text>
  <path class="l" d="M1180 528V550"/>
  <text x="90" y="630" class="s" font-size="16">边界：无自动转接单；生成失败提示不可用，限定语校验失败则明确降级为原文要点。</text>
</svg>
