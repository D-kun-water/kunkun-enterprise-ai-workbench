<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>.t{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#172033}.s{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#475569;font-size:18px}.b{fill:#fff;stroke:#94a3b8;stroke-width:2}.p{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.g{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.o{fill:#fff7ed;stroke:#f97316;stroke-width:2}.l{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="700" fill="#f8fafc"/><rect x="48" y="42" width="1504" height="610" rx="18" fill="#fff" stroke="#dbe3ef" stroke-width="2"/>
  <text x="88" y="102" class="t" font-size="30" font-weight="700">图 2｜知识库运营与质量闭环</text><text x="88" y="138" class="s">流程约定：上传与评测已有工具；资料确认、坏例归因与收录回归由人员执行</text>
  <path class="l" d="M325 300H400"/><path class="l" d="M575 300H650"/><path class="l" d="M825 300H900"/><path class="l" d="M1075 300H1150"/><path class="l" d="M1325 300H1400V590H428V558"/>
  <rect class="b" x="130" y="242" width="195" height="116" rx="12"/><text class="t" x="228" y="281" text-anchor="middle" font-size="20" font-weight="700">维护人员更新</text><text class="t" x="228" y="312" text-anchor="middle" font-size="20" font-weight="700">制度目录文件</text>
  <rect class="p" x="400" y="242" width="175" height="116" rx="12"/><text class="t" x="488" y="281" text-anchor="middle" font-size="20" font-weight="700">解析、切分、</text><text class="t" x="488" y="312" text-anchor="middle" font-size="20" font-weight="700">建立检索索引</text>
  <rect class="g" x="650" y="242" width="175" height="116" rx="12"/><text class="t" x="738" y="281" text-anchor="middle" font-size="20" font-weight="700">执行固定题集</text><text class="t" x="738" y="312" text-anchor="middle" font-size="20" font-weight="700">离线质量评测</text>
  <polygon points="988,225 1075,300 988,375 900,300" fill="#fff" stroke="#64748b" stroke-width="2"/><text class="t" x="988" y="294" text-anchor="middle" font-size="20" font-weight="700">是否达到</text><text class="t" x="988" y="322" text-anchor="middle" font-size="20" font-weight="700">验收条件？</text>
  <rect class="g" x="1150" y="242" width="175" height="116" rx="12"/><text class="t" x="1238" y="281" text-anchor="middle" font-size="20" font-weight="700">人工确认继续</text><text class="t" x="1238" y="312" text-anchor="middle" font-size="20" font-weight="700">提供员工查询</text>
  <rect class="o" x="300" y="442" width="255" height="116" rx="12"/><text class="t" x="428" y="480" text-anchor="middle" font-size="20" font-weight="700">聚合“没帮助”、</text><text class="t" x="428" y="512" text-anchor="middle" font-size="20" font-weight="700">反馈原因与错误案例</text>
  <rect class="p" x="690" y="442" width="255" height="116" rx="12"/><text class="t" x="818" y="480" text-anchor="middle" font-size="20" font-weight="700">定位原因：文档、</text><text class="t" x="818" y="512" text-anchor="middle" font-size="20" font-weight="700">切分、检索或答复</text>
  <path class="l" d="M555 500H690"/><path class="l" d="M818 442V400H738V358"/><path class="l" d="M988 375V480H945"/><text x="750" y="390" class="s" font-size="16">修复后重评</text><text x="1095" y="280" class="s" font-size="16">是</text><text x="1002" y="405" class="s" font-size="16">否</text>
  <text x="90" y="630" class="s" font-size="16">边界：尚无自动发布、工单指派或版本回滚；固定召回得分不替代人工事实与来源核验。</text>
