<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>.t{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#172033}.s{font-family:'Microsoft YaHei',Arial,sans-serif;fill:#475569;font-size:18px}.b{fill:#fff;stroke:#94a3b8;stroke-width:2}.p{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.g{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.o{fill:#fff7ed;stroke:#f97316;stroke-width:2}.l{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="700" fill="#f8fafc"/><rect x="48" y="42" width="1504" height="610" rx="18" fill="#fff" stroke="#dbe3ef" stroke-width="2"/>
  <text x="88" y="102" class="t" font-size="30" font-weight="700">图 3｜合同审阅辅助与人工协同</text><text x="88" y="138" class="s">定位：合同条款检索与审阅辅助，不替代法务判断，不输出法律结论</text>
  <path class="l" d="M270 300H335"/><path class="l" d="M505 300H570"/><path class="l" d="M740 300H805"/><path class="l" d="M975 300H1040"/><path class="l" d="M1210 300H1275"/>
  <rect class="b" x="90" y="242" width="180" height="116" rx="12"/><text class="t" x="180" y="281" text-anchor="middle" font-size="20" font-weight="700">法务 / 业务人员</text><text class="t" x="180" y="312" text-anchor="middle" font-size="20" font-weight="700">选择合同与问题</text>
  <polygon points="420,225 505,300 420,375 335,300" fill="#fff" stroke="#64748b" stroke-width="2"/><text class="t" x="420" y="294" text-anchor="middle" font-size="19" font-weight="700">是否在允许</text><text class="t" x="420" y="321" text-anchor="middle" font-size="19" font-weight="700">角色范围？</text>
  <rect class="p" x="570" y="242" width="170" height="116" rx="12"/><text class="t" x="655" y="281" text-anchor="middle" font-size="20" font-weight="700">读取授权合同</text><text class="t" x="655" y="312" text-anchor="middle" font-size="20" font-weight="700">规则定位条款</text>
  <rect class="g" x="805" y="242" width="170" height="116" rx="12"/><text class="t" x="890" y="281" text-anchor="middle" font-size="20" font-weight="700">输出审阅提示、</text><text class="t" x="890" y="312" text-anchor="middle" font-size="18" font-weight="700">待确认项、原文依据</text>
  <polygon points="1125,225 1210,300 1125,375 1040,300" fill="#fff" stroke="#64748b" stroke-width="2"/><text class="t" x="1125" y="294" text-anchor="middle" font-size="19" font-weight="700">人工复核</text><text class="t" x="1125" y="321" text-anchor="middle" font-size="19" font-weight="700">是否完成？</text>
  <rect class="o" x="1275" y="242" width="180" height="116" rx="12"/><text class="t" x="1365" y="281" text-anchor="middle" font-size="20" font-weight="700">补充资料并</text><text class="t" x="1365" y="312" text-anchor="middle" font-size="20" font-weight="700">继续人工核验</text>
  <path class="l" d="M420 375V480H520"/><rect class="o" x="520" y="422" width="250" height="116" rx="12"/><text class="t" x="645" y="460" text-anchor="middle" font-size="20" font-weight="700">提示“合同不可用”</text><text class="t" x="645" y="492" text-anchor="middle" font-size="20">不泄露标题、金额、片段</text>
  <path class="l" d="M1125 375V480H1040"/><rect class="g" x="850" y="422" width="190" height="116" rx="12"/><text class="t" x="945" y="460" text-anchor="middle" font-size="20" font-weight="700">下载核对记录</text><text class="t" x="945" y="492" text-anchor="middle" font-size="20">及文本版本</text>
  <text x="520" y="280" class="s" font-size="16">是</text><text x="433" y="402" class="s" font-size="16">否</text><text x="1228" y="280" class="s" font-size="16">否</text><text x="1138" y="402" class="s" font-size="16">是</text>
  <text x="90" y="630" class="s" font-size="16">边界：预置角色不是真实认证；人工记录仅保留在会话并可导出，没有服务端归档或审批签名。</text>
</svg>
